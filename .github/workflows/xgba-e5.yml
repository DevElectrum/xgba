name: XGBA E5 extended-save emulator build

on:
  push:
    branches:
      - xgba/e5-save-expansion
  pull_request:
    branches:
      - xgba/p1-fast-forward

permissions:
  contents: read

jobs:
  linux-e5-core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config libcmocka-dev zlib1g-dev libsdl2-dev
      - name: Configure XGBA core and test suite
        run: |
          cmake -S . -B build-xgba -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DM_CORE_GBA=ON \
            -DM_CORE_GB=OFF \
            -DBUILD_QT=OFF \
            -DBUILD_SDL=ON \
            -DSDL_VERSION=2 \
            -DBUILD_HEADLESS=ON \
            -DBUILD_SUITE=ON \
            -DENABLE_SCRIPTING=OFF \
            -DUSE_FFMPEG=OFF \
            -DUSE_EDITLINE=OFF \
            -DUSE_DISCORD_RPC=OFF
      - name: Compile emulator and tests
        run: cmake --build build-xgba --parallel 2
      - name: Generate tagged and legacy test ROMs
        run: |
          python3 tools/xgba_generate_test_rom.py build-xgba/xgba-integration.gba
          python3 tools/xgba_generate_test_rom.py --legacy build-xgba/legacy-integration.gba
      - name: Verify fast-forward not regressed
        run: python3 tools/xgba_check_fast_forward.py
      - name: Run emulator tests
        env:
          XGBA_TEST_ROM: ${{ github.workspace }}/build-xgba/xgba-integration.gba
          XGBA_LEGACY_ROM: ${{ github.workspace }}/build-xgba/legacy-integration.gba
        run: ctest --test-dir build-xgba --output-on-failure
