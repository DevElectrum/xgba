name: XGBA baseline CI

on:
  push:
    branches:
      - master
      - release/xgba-v0.1.0
      - xgba/p0-foundation
      - xgba/p0-validation-20261030
      - xgba/p1-fast-forward
  pull_request:
    branches:
      - master
      - xgba/p0-foundation
      - xgba/p0-validation-20261030
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config libcmocka-dev zlib1g-dev libsdl2-dev

      - name: Configure headless GBA build
        run: |
          cmake -S . -B build-xgba -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DM_CORE_GBA=ON \
            -DM_CORE_GB=OFF \
            -DBUILD_QT=OFF \
            -DBUILD_SDL=ON \
            -DSDL_VERSION=2 \
            -DBUILD_HEADLESS=ON \
            -DBUILD_SUITE=ON \
            -DENABLE_SCRIPTING=OFF \
            -DUSE_FFMPEG=OFF \
            -DUSE_EDITLINE=OFF \
            -DUSE_DISCORD_RPC=OFF

      - name: Build emulator and tests
        run: cmake --build build-xgba --parallel 2

      - name: Confirm tests were discovered
        run: |
          ctest --test-dir build-xgba -N | tee xgba-test-list.txt
          if grep -q 'Total Tests: 0' xgba-test-list.txt; then
            echo 'No tests discovered' >&2
            exit 1
          fi

      - name: Generate extended and legacy test cartridges
        run: |
          python3 tools/xgba_generate_test_rom.py build-xgba/xgba-integration.gba
          python3 tools/xgba_generate_test_rom.py --legacy build-xgba/legacy-integration.gba

      - name: Verify mandatory SDL fast-forward behavior
        run: python3 tools/xgba_check_fast_forward.py

      - name: Run baseline and integration tests
        env:
          XGBA_TEST_ROM: ${{ github.workspace }}/build-xgba/xgba-integration.gba
          XGBA_LEGACY_ROM: ${{ github.workspace }}/build-xgba/legacy-integration.gba
        run: ctest --test-dir build-xgba --output-on-failure

      - name: Verify headless and SDL desktop emulator builds
        run: |
          test -x build-xgba/xgba-headless
          test -x build-xgba/sdl/xgba-sdl

